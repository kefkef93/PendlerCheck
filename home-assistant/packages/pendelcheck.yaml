        device_class: problem
        value_template: '{% set ns2 = namespace(c=false) %}{% for j in value_json.journeys[:3] %}{% for l in j.legs %}{% if l.cancelled %}{% set ns2.c = true %}{% endif %}{% endfor %}{% endfor %}{{ ns2.c }}'

