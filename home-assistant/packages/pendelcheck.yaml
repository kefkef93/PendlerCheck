template:
  - sensor:
      - name: "Pendelcheck Hinfahrt Empfehlung"
        unique_id: pendelcheck_hin_empfehlung
        icon: mdi:star-outline
        state: '{% set r = [(''Wustermark'', states(''sensor.pendelcheck_hinfahrt_wustermark_zuverlassigkeit'') | int(0)), (''Nauen'', states(''sensor.pendelcheck_hinfahrt_nauen_zuverlassigkeit'') | int(0)), (''Brandenburg'', states(''sensor.pendelcheck_hinfahrt_brandenburg_zuverlassigkeit'') | int(0))] | sort(attribute=1, reverse=true) %}{{ r[0][0] if r[0][1] > 0 else ''unbekannt'' }}'
      - name: "Pendelcheck Rückfahrt Empfehlung"
        unique_id: pendelcheck_rueck_empfehlung
        icon: mdi:star-outline
        state: '{% set r = [(''Wustermark'', states(''sensor.pendelcheck_ruckfahrt_wustermark_zuverlassigkeit'') | int(0)), (''Nauen'', states(''sensor.pendelcheck_ruckfahrt_nauen_zuverlassigkeit'') | int(0)), (''Brandenburg'', states(''sensor.pendelcheck_ruckfahrt_brandenburg_zuverlassigkeit'') | int(0))] | sort(attribute=1, reverse=true) %}{{ r[0][0] if r[0][1] > 0 else ''unbekannt'' }}'
